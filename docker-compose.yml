services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}

    ports:
      - "5432:5432"

    volumes:
      - devflow_postgres_data:/var/lib/postgresql/data

volumes:
  devflow_postgres_data:
